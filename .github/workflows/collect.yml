name: collect

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    env:
      URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --prefix ship-map-site/collector --no-audit --no-fund

      - name: Publish the page (only when it changed)
        run: |
          rm -rf pages
          if git ls-remote --exit-code --heads "$URL" gh-pages >/dev/null 2>&1; then
            git clone -q --depth 1 --branch gh-pages "$URL" pages
          else
            mkdir pages
            git -C pages init -q -b gh-pages
            git -C pages remote add origin "$URL"
          fi
          cp ship-map-site/docs/index.html pages/index.html
          touch pages/.nojekyll
          cd pages
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name=ship-bot -c user.email=ship-bot@users.noreply.github.com commit -q -m "page"
            git push -q origin gh-pages
          fi

      - name: Listen for about 55 minutes and publish every minute
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          OUT_FILE: data/snapshot.json
          DURATION_SEC: "3300"
        run: |
          rm -rf data
          if git ls-remote --exit-code --heads "$URL" data >/dev/null 2>&1; then
            git clone -q --depth 1 --branch data "$URL" data
          else
            mkdir data
          fi

          push_data() {
            [ -f data/snapshot.json ] || return 0
            rm -rf pub && mkdir pub
            cp data/snapshot.json pub/snapshot.json
            ( cd pub \
              && git init -q -b data \
              && git add -A \
              && git -c user.name=ship-bot -c user.email=ship-bot@users.noreply.github.com commit -q -m "snapshot $(date -u +%H:%M)Z" \
              && git push -q -f "$URL" data:data ) || echo "push failed (will retry next minute)"
          }

          node ship-map-site/collector/collect.mjs &
          CPID=$!
          while kill -0 "$CPID" 2>/dev/null; do
            sleep 60
            push_data
          done
          CODE=0
          wait "$CPID" || CODE=$?
          push_data

          if [ "$CODE" -eq 0 ]; then
            gh workflow run collect.yml --ref "${GITHUB_REF_NAME}" || echo "could not start the next run"
          fi
          exit "$CODE"
