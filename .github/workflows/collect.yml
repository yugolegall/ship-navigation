name: collect

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get the published branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$URL" site
          else
            mkdir -p site
            git -C site init -q
            git -C site remote add origin "$URL"
          fi

      - name: Install
        run: npm install --prefix ship-map-site/collector --no-audit --no-fund

      - name: Listen to AIS and update the snapshot
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          SITE_DIR: site
          DURATION_SEC: "230"
        run: node ship-map-site/collector/collect.mjs

      - name: Publish
        run: |
          cp ship-map-site/docs/index.html site/index.html
          touch site/.nojekyll
          cd site
          git config user.name "ship-bot"
          git config user.email "ship-bot@users.noreply.github.com"
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git checkout -q --orphan snap
          else
            git checkout -q -b snap
          fi
          git add -A
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin snap:gh-pages
